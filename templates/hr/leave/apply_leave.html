{% extends 'hr/base.html' %}

{% block title %}Apply for Leave{% endblock %}

{% block content %}
<div class="glass section" style="padding: 20px; max-width: 600px; margin: auto;">
    <h2 class="page-heading">Apply for Leave</h2>

    <form method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success" style="padding:10px 20px;">
            Submit Request
        </button>
    </form>
</div>
{% endblock %}
